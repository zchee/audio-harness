[project]
name = "audio-harness"
version = "0.1.0"
description = "Cross-vendor STT/TTS benchmark harness: accuracy, streaming latency, and cost"
readme = "README.md"
authors = [
    { name = "Koichi Shiraishi", email = "zchee.io@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "httpx[http2]>=0.28.1",
    "websockets>=16.1.1",
    "jiwer>=4.0.0",
    "numpy>=2.4.6",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "polars>=1.43.2",
    "orjson>=3.11.9",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "pyyaml>=6.0.3",
    "google-auth>=2.56.3",
    "google-cloud-speech>=2.40.0",
    "google-genai>=2.17.0",
    "matplotlib>=3.11.1",
    "adjusttext>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]
# Local Whisper round-trip judge (Apple Silicon; see stt/whisper_local.py).
# The numba floor keeps resolution on a line with Python 3.14 wheels; without
# it the resolver backtracks to numba 0.53 / llvmlite 0.36, which only build
# on Python < 3.10.
judge-whisper = [
    "mlx-whisper>=0.4.3",
    "numba>=0.66.0",
]
# Distill-MOS perceptual regression guardrail (see tts_quality.py). CPU-only,
# no GPU required; pulls in torch as a transitive dependency.
guardrail-mos = [
    "distillmos>=0.9.1",
]
# SeMaScore fallback encoder for the semantic judge (judge/semantic.py):
# roberta-base at a pinned revision, CPU inference only.
judge-semantic = [
    "transformers>=5.14.1",
    "torch>=2.13.0",
]
# Simulated-interview persona voice (sim/interview.py): Kokoro pinned at
# 0.9.4, out-of-suite so no STT lane is scored on its own family's voice.
# The en_core_web_sm wheel is load-bearing: misaki's English G2P otherwise
# tries a runtime `pip install` of the spaCy model, which raises SystemExit
# in uv-managed environments (no pip). Verified on Python 3.14.6/arm64.
sim-kokoro = [
    "kokoro==0.9.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
# TTS prompt suite generators (tools/gen_entity_prompts.py): num2words for
# spoken-form number/date/currency words, Faker for names and alphanumeric
# templates, Babel for CLDR-backed locale date/currency formatting.
prompt-suite = [
    "num2words>=0.5.14",
    "faker>=40.36.0",
    "babel>=2.18.0",
]

[project.scripts]
audio-harness = "audio_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The sim-kokoro extra pins the spaCy en_core_web_sm model by wheel URL
# (spaCy models are not on PyPI); hatchling refuses direct references
# without this switch.
allow-direct-references = true

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 120
preview = true
unsafe-fixes = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "D", "PIE", "PERF",
    "PT", "T20", "TID", "PTH", "TRY", "PYI", "ANN", "ARG", "ASYNC", "SLF",
    "RET", "FURB", "G", "LOG", "N", "unnecessary-paren-on-raise-exception", "SLOT", "blanket-type-ignore", "blanket-noqa", "implicit-namespace-package",
]
ignore = [
    # Provider SDK callbacks and API shims use externally-dictated names.
    "invalid-function-name", "invalid-first-argument-name-for-method",
    # Formatter-conflict set: ruff format owns whitespace and line length.
    "tab-indentation", "indentation-with-invalid-multiple", "indentation-with-invalid-multiple-comment", "over-indented", "docstring-tab-indentation", "triple-single-quotes", "line-too-long",
    # Typer/FastAPI-style call-in-default is intentional; terse exceptions
    # and Any-typed escape hatches are accepted; broad pytest.raises OK.
    "function-call-in-default-argument", "raise-vanilla-args", "any-type", "pytest-raises-too-broad",
    # Complexity thresholds are judged in review, not by the linter.
    "too-many-return-statements", "too-many-branches", "too-many-arguments", "too-many-locals", "too-many-statements", "complex-structure",
]

[tool.ruff.lint.per-file-ignores]
# float-equality-comparison: metric assertions here are deterministic by
# construction; exact equality is the point and approx would weaken it.
"tests/**" = ["ANN", "ARG", "D", "private-member-access", "implicit-namespace-package", "float-equality-comparison"]
"tools/**" = ["implicit-namespace-package", "print", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2
split-on-trailing-comma = true
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # google-genai touches typing internals that Python 3.14 deprecates; the
    # noise is upstream's to fix and drowns real warnings in test output.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true
