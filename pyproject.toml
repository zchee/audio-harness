[project]
name = "audio-harness"
version = "0.1.0"
description = "Cross-vendor STT/TTS benchmark harness: accuracy, streaming latency, and cost"
readme = "README.md"
authors = [
    { name = "Koichi Shiraishi", email = "zchee.io@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx[http2]>=0.28",
    "websockets>=14.0",
    "jiwer>=3.1",
    "numpy>=2.1",
    "soundfile>=0.13",
    "soxr>=0.5",
    "polars>=1.20",
    "orjson>=3.10",
    "rich>=13.9",
    "typer>=0.15",
    "pyyaml>=6.0",
    "google-auth>=2.37",
    "google-cloud-speech>=2.31",
    "google-genai>=1.0",
    "matplotlib>=3.10",
    "adjusttext>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]
# Local Whisper round-trip judge (Apple Silicon; see stt/whisper_local.py).
# The numba floor keeps resolution on a line with Python 3.14 wheels; without
# it the resolver backtracks to numba 0.53 / llvmlite 0.36, which only build
# on Python < 3.10.
judge-whisper = [
    "mlx-whisper>=0.4.3",
    "numba>=0.66",
]
# Distill-MOS perceptual regression guardrail (see tts_quality.py). CPU-only,
# no GPU required; pulls in torch as a transitive dependency.
guardrail-mos = [
    "distillmos>=0.9.1",
]
# TTS prompt suite generators (tools/gen_entity_prompts.py): num2words for
# spoken-form number/date/currency words, Faker for names and alphanumeric
# templates, Babel for CLDR-backed locale date/currency formatting.
prompt-suite = [
    "num2words>=0.5.14",
    "faker>=40.0",
    "babel>=2.18",
]

[project.scripts]
audio-harness = "audio_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
