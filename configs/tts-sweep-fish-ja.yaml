# Fish Audio Japanese pass — the backlog flagged Fish as the ja-strong
# vendor, so all three models get the ja suite. Judge mirrors tts-ja.yaml.
#
#   uv run audio-harness tts configs/tts-sweep-fish-ja.yaml

tts:
  - name: or-fish-s1
    modes: [batch]
  - name: or-fish-s2-pro
    modes: [batch]
  - name: or-fish-s21-pro
    modes: [batch]

dataset:
  prompts: data/prompts-ja/bench.txt
  language: ja-JP
  limit: null

roundtrip_stt:
  - name: whisper-local

run:
  repeats: 3
  warmup: 1
  provider_concurrency: 3
  timeout_s: 300
  output_dir: results
