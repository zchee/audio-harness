# Scoped add-lane run: elevenlabs-v3 only, under the exact conditions of
# configs/tts-ja.yaml (same prompts, judge and voice pin) so the report's
# supersede merge against the canonical ja TTS run is apples-to-apples.
#
#   uv run audio-harness tts configs/tts-ja-elevenv3.yaml

tts:
  - name: elevenlabs-v3
    modes: [batch, stream]
    options:
      # Same "Sarah" pin as elevenlabs-flash25 in tts-ja.yaml.
      voice_id: EXAVITQu4vr4xnSDxMaL

dataset:
  prompts: data/prompts-ja/bench.txt
  language: ja-JP
  limit: null

roundtrip_stt:
  - name: whisper-local

run:
  repeats: 3
  warmup: 1
  provider_concurrency: 1
  timeout_s: 300
  output_dir: results
