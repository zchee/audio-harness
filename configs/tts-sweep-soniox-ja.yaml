# Soniox tts-rt-v2 Japanese sweep: REST batch plus WebSocket streaming.
# Judge mirrors tts-ja.yaml (whisper-local only).
#
#   uv run audio-harness tts configs/tts-sweep-soniox-ja.yaml

tts:
  - name: soniox-tts-rt-v2
    modes: [batch, stream]

dataset:
  prompts: data/prompts-ja/bench.txt
  language: ja-JP
  limit: null

roundtrip_stt:
  - name: whisper-local

run:
  repeats: 3
  warmup: 1
  provider_concurrency: 2
  timeout_s: 300
  output_dir: results
