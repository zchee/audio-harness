# parakeet-ane over the English pipecat corpus for the canonical en rankings.
#
#   uv run audio-harness stt configs/stt-sweep-parakeet-en.yaml

stt:
  - name: parakeet-ane
    modes: [batch]
    options:
      timeout_s: 1800.0

dataset:
  parquet: data/hf/stt-benchmark-data/data/train-00000-of-00001.parquet
  id_column: sample_id
  audio_column: audio
  text_column: transcription
  language: en-US
  limit: 30
  sample_seed: 20260805

run:
  repeats: 1
  warmup: 1
  chunk_ms: 20
  realtime: true
  provider_concurrency: 1
  timeout_s: 1800
  output_dir: results
