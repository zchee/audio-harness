# Japanese TTS benchmark across every provider with a ja-capable voice.
#
#   uv run audio-harness tts configs/tts-ja.yaml
#
# Prompts: data/prompts-ja/bench.txt — five spontaneous/literary sentences from
# the CC0 Common Voice layer plus three entity hard cases (quantities). The
# per-language interview questions are still PENDING native authoring.
#
# roundtrip_stt uses whisper-local ONLY. deepgram-nova3 is deliberately absent:
# the canonical 12-language run measured its Japanese output at >100% error —
# a judge that cannot transcribe Japanese would poison every ranked score.
# whisper-local (openai family) is cross-family for all six candidates, so the
# per-candidate validation passes with a single judge.

tts:
  - name: cartesia-sonic35
    modes: [batch, stream]
  - name: cartesia-sonic3
    modes: [batch, stream]
  - name: deepgram-aura2
    modes: [batch, stream]
  - name: gemini-tts
    modes: [batch, stream]
  - name: inworld-tts2
    modes: [batch, stream]
  - name: elevenlabs-flash25
    modes: [batch, stream]
    options:
      # "Sarah" (premade, multilingual via Flash v2.5). Pinned for
      # reproducibility, same voice as the English config.
      voice_id: EXAVITQu4vr4xnSDxMaL

dataset:
  prompts: data/prompts-ja/bench.txt
  language: ja-JP
  limit: null

roundtrip_stt:
  - name: whisper-local

run:
  repeats: 3
  warmup: 1
  provider_concurrency: 4
  timeout_s: 300
  output_dir: results
