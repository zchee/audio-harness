# English TTS benchmark across every configured provider.
#
#   uv run audio-harness tts configs/tts-en.yaml
#
# roundtrip_stt lists the fixed recognizers that transcribe each synthesized
# clip to estimate intelligibility. Hold the set constant across runs —
# changing it changes every score. Judges must span vendor families: a lane
# is ranked only by judges outside its own family, so deepgram-aura2 is
# ranked by whisper-local while the deepgram judge stays diagnostic.

tts:
  - name: cartesia-sonic35
    modes: [batch, stream]
  - name: cartesia-sonic3
    modes: [batch, stream]
  - name: deepgram-aura2
    modes: [batch, stream]
  - name: gemini-tts
    modes: [batch, stream]
  - name: inworld-tts2
    modes: [batch, stream]
  - name: elevenlabs-flash25
    modes: [batch, stream]
    options:
      # "Sarah" (premade). Pinned in config, not env, so every run of this
      # file scores the same voice.
      voice_id: EXAVITQu4vr4xnSDxMaL

dataset:
  prompts: data/prompts-en.txt
  language: en-US
  limit: null

# Text formatting MUST stay off here. With smart_format on, the recognizer
# rewrites "four hundred and twenty dollars" as "$420" for every engine alike,
# and the score stops discriminating between voices entirely. whisper-local
# needs the optional dependency group: uv sync --extra judge-whisper.
roundtrip_stt:
  - name: deepgram-nova3
    options:
      smart_format: false
  - name: whisper-local

run:
  repeats: 3
  warmup: 1
  provider_concurrency: 4
  timeout_s: 300
  output_dir: results
