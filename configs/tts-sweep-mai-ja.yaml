# Microsoft MAI Voice 2 / 2 Flash (OpenRouter) Japanese sweep. MAI requires
# Azure-style neural voice names, so the ja lanes pin ja-JP-NanamiNeural
# (probe-verified 2026-08-12). Judge mirrors tts-ja.yaml (whisper-local).
#
#   uv run audio-harness tts configs/tts-sweep-mai-ja.yaml

tts:
  - name: or-mai-voice-2
    modes: [batch]
    options:
      voice: ja-JP-NanamiNeural
  - name: or-mai-voice-2-flash
    modes: [batch]
    options:
      voice: ja-JP-NanamiNeural

dataset:
  prompts: data/prompts-ja/bench.txt
  language: ja-JP
  limit: null

roundtrip_stt:
  - name: whisper-local

run:
  repeats: 3
  warmup: 1
  provider_concurrency: 2
  timeout_s: 300
  output_dir: results
