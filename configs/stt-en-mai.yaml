# Microsoft MAI transcribe 1.5 through OpenRouter on the canonical English
# corpus (hosted-proxy, batch-only; probe-verified 2026-08-12). Same pipecat
# parquet, seed and limit as the canonical English table.
#
#   uv run audio-harness stt configs/stt-en-mai.yaml

stt:
  - name: or-mai-transcribe
    modes: [batch]

dataset:
  parquet: data/hf/stt-benchmark-data/data/train-00000-of-00001.parquet
  id_column: sample_id
  audio_column: audio
  text_column: transcription
  language: en-US
  limit: 30
  sample_seed: 20260805

run:
  repeats: 3
  warmup: 1
  provider_concurrency: 2
  timeout_s: 300
  output_dir: results
