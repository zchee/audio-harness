# Scoped add-lane run: elevenlabs-v3 only, under the exact conditions of
# configs/tts-en.yaml (same prompts, judges and voice pin) so the report's
# supersede merge against the canonical en TTS run is apples-to-apples.
#
#   uv run audio-harness tts configs/tts-en-elevenv3.yaml

tts:
  - name: elevenlabs-v3
    modes: [batch, stream]
    options:
      # Same "Sarah" pin as elevenlabs-flash25 in tts-en.yaml.
      voice_id: EXAVITQu4vr4xnSDxMaL

dataset:
  prompts: data/prompts-en.txt
  language: en-US
  limit: null

roundtrip_stt:
  - name: deepgram-nova3
    options:
      smart_format: false
  - name: whisper-local

run:
  repeats: 3
  warmup: 1
  provider_concurrency: 1
  timeout_s: 300
  output_dir: results
